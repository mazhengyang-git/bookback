 <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
      <filter id="waterWave">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.02"
          numOctaves="1"
          result="turbulence"
          seed="2"
        >
          <animate attributeName="seed" values="2;10;2" dur="8s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap
          in="SourceGraphic"
          in2="turbulence"
          scale="3"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>